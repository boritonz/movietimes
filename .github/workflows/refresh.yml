name: refresh listings

on:
  schedule:
    # 19:00 UTC = 07:00 NZST / 06:00 NZDT - well before "now showing" is checked
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape listings
        # Per-cinema failures are handled inside scrape.py (it falls back to
        # the previous/seed entry and always exits 0). This continue-on-error
        # is a second line of defence so a totally unexpected crash still
        # lets render.py run against whatever data/latest.json we have.
        run: python scrape.py || true

      - name: Render site
        run: python render.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json docs/index.html
          git diff --staged --quiet || git commit -m "refresh listings"
          git push
